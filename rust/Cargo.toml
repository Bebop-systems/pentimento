[package]
name = "pentimento"
version = "0.1.4"
edition = "2021"
rust-version = "1.82"
description = "Inspect and rewrite photo metadata, locally"
license = "MIT"
repository = "https://github.com/Bebop-systems/pentimento"

# Self-dependent by intent. The count below is the whole tree, and it is
# the number to watch: every crate here is one more thing that can change
# under the application between releases.
#
# What is deliberately absent: no HTTP server, no async runtime, no TLS
# stack, no templating engine. The Python version needed a loopback
# listener because a browser can only fetch over HTTP; a webview can be
# handed a custom protocol instead, so the network disappears entirely.
[dependencies]
wry = "0.47"
tao = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES pointer, so it is gated
    # behind this even though no security descriptor is ever passed.
    "Win32_Security",
] }

[profile.release]
opt-level = "z"      # size over speed: nothing here is compute bound
lto = true
codegen-units = 1
panic = "abort"
strip = true
